name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        working-directory: tray
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary hidapi -r requirements.txt pyinstaller pytest

      - name: Run tests
        working-directory: tray
        run: python -m pytest -q tests

      - name: Build tray app
        working-directory: tray
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name "ATK Battery" --icon app.ico
          --hidden-import pystray._win32 atk_tray.pyw

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json

      - name: Build Stream Deck plugin
        working-directory: streamdeck
        run: |
          npm ci
          npm run validate
          npm run pack

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "tray/dist/ATK Battery.exe" out/
          Copy-Item streamdeck/dist/*.streamDeckPlugin out/

      - uses: actions/upload-artifact@v4
        with:
          name: atk-battery
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
